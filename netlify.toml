# Netlify: the Angular site is served as static files, the Express API runs as a function.
[build]
  command = "npm run install:all && npm run build:netlify"
  publish = "frontend/dist/frontend/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.21.0"

[functions]
  node_bundler = "esbuild"

# API -> serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Angular routes (/shop, /product/...) -> index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
