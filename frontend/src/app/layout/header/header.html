<header class="header" [class.is-scrolled]="scrolled()" [class.is-open]="menuOpen()">
  <div class="container header__inner">
    <a routerLink="/" class="brand" aria-label="Gulora home">
      <img src="brand/generated/logo-96.webp" alt="" class="brand__logo" width="46" height="46" />
      <span class="brand__text">
        <span class="brand__name">{{ settings.settings().brandName }}</span>
        <span class="brand__tagline">{{ settings.settings().tagline }}</span>
      </span>
    </a>

    <nav class="nav" id="main-nav" aria-label="Main">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="nav__link"
          >{{ link.label }}</a
        >
      }
      <a class="btn btn--whatsapp nav__cta" [href]="whatsapp.generalLink()" target="_blank" rel="noopener">
        <app-icon name="whatsapp" /> Chat with us
      </a>
    </nav>

    <div class="header__actions">
      <app-theme-toggle />
      @if (settings.storeEnabled()) {
        <a routerLink="/cart" class="icon-btn cart-btn" aria-label="Shopping bag">
          <app-icon name="bag" />
          @if (cart.count()) {
            <span class="cart-btn__count">{{ cart.count() }}</span>
          }
        </a>
      }
      <button
        type="button"
        class="icon-btn menu-btn"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-nav"
        aria-label="Menu"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      </button>
    </div>
  </div>
</header>
