# Render Blueprint: https://render.com/docs/blueprint-spec
# One Node service builds the Angular site and serves it together with the API.
services:
  - type: web
    name: gulora
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: WHATSAPP_NUMBER
        value: "923712331745"
      - key: STORE_ENABLED
        value: "false"
      - key: SHOW_PRICES
        value: "false"
      - key: CURRENCY
        value: PKR
      - key: DEFAULT_THEME
        value: blush
      - key: INSTAGRAM_URL
        value: ""
      - key: FACEBOOK_URL
        value: ""
      - key: CONTACT_EMAIL
        value: ""
